<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .cart-container {
            width: 80%;
            margin: auto;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #ccc;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #e6e6e6;
        }

        .total {
            text-align: right;
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
        }

        .back-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="cart-container">

    <h2>Shopping Cart</h2>

    <table>
        <thead>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${cartItems}">
            <td th:text="${item.product.name}"></td>
            <td>₹ <span th:text="${item.product.price}"></span></td>
            <td th:text="${item.quantity}"></td>
            <td>₹ <span th:text="${item.totalPrice}"></span></td>
        </tr>
        </tbody>
    </table>

    <div class="total">
        Total Amount: ₹ <span th:text="${totalAmount}"></span>
    </div>

    <a href="/" class="back-btn">Back to Products</a>

</div>

</body>
</html>
